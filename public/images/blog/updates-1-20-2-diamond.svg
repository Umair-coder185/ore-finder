<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Minecraft 1.20.2 and 1.21 Medium Diamond Placement Update Diagram">
  <rect width="1200" height="630" fill="#111916"/>
  <rect x="80" y="60" width="1040" height="510" rx="16" fill="#15201B" stroke="#34443B" stroke-width="2"/>
  <text x="120" y="115" fill="#69C598" font-family="monospace" font-size="18" font-weight="bold">OREFINDER.IO // 1.20.2 &amp; 1.21 DIAMOND PLACEMENT UPDATE</text>
  <text x="120" y="150" fill="#A8B8AF" font-family="sans-serif" font-size="16">Addition of ore_diamond_medium (Uniform Y = -64 to -4) in Upper Deepslate</text>
