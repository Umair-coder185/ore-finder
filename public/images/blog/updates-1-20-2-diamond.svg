  <text x="160" y="255" fill="#A8B8AF" font-family="monospace" font-size="16" font-weight="bold">MINECRAFT 1.18 – 1.19.4 (3 PASSES)</text>
  <text x="160" y="295" fill="#F4F7F4" font-family="monospace" font-size="14">• ore_diamond (7/chunk, size 4)</text>
  <text x="160" y="330" fill="#F4F7F4" font-family="monospace" font-size="14">• ore_diamond_large (1/9 chunks, size 12)</text>
  <text x="160" y="365" fill="#F4F7F4" font-family="monospace" font-size="14">• ore_diamond_buried (4/chunk, size 8)</text>

  <rect x="630" y="210" width="440" height="280" rx="12" fill="#111916" stroke="#5CE1E6" stroke-width="2"/>
  <text x="660" y="255" fill="#5CE1E6" font-family="monospace" font-size="16" font-weight="bold">MINECRAFT 1.20.2 – 1.21 (4 PASSES)</text>
  <text x="660" y="295" fill="#F4F7F4" font-family="monospace" font-size="14">• All 3 original passes PLUS:</text>
  <text x="660" y="335" fill="#69C598" font-family="monospace" font-size="14" font-weight="bold">+ ore_diamond_medium (2/chunk, size 8)</text>
  <text x="660" y="365" fill="#A8B8AF" font-family="monospace" font-size="13">  Uniform Y = -64 to -4 (50% air discard)</text>
