  <text x="150" y="470" fill="#FB923C" font-family="monospace" font-size="16" font-weight="bold">Y = -55 TO -64: LAVA AQUIFER BASIN (FLOODED CAVERN LEVEL)</text>
  <text x="150" y="240" fill="#F4F7F4" font-family="monospace" font-size="15" font-weight="bold">Y = -54 FLOOR: SAFE HORIZON ABOVE LAVA BASINS</text>
