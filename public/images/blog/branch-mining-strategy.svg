  <rect x="80" y="60" width="1040" height="510" rx="16" fill="#15201B" stroke="#34443B" stroke-width="2"/>
  <text x="120" y="115" fill="#69C598" font-family="monospace" font-size="18" font-weight="bold">OREFINDER.IO // BRANCH MINING GEOMETRY AT Y = -54</text>
  <text x="120" y="150" fill="#A8B8AF" font-family="sans-serif" font-size="16">1x2 Tunnel Spacing, 3-Block Rib Intervals, and Lava Aquifer Floor Clearance</text>
  <g stroke="#26332C" stroke-width="1.5">
    <line x1="120" y1="220" x2="1080" y2="220"/>
    <line x1="120" y1="300" x2="1080" y2="300"/>
    <line x1="120" y1="380" x2="1080" y2="380"/>
    <line x1="120" y1="460" x2="1080" y2="460"/>
